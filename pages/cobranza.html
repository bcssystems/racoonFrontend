<div class="page-content">
  <div class="page-header"><div><h4><i class="fas fa-hand-holding-dollar me-2" style="color:var(--primary)"></i>Cobranza</h4><small class="text-muted">Agenda de cobros y registro de abonos</small></div></div>
  <div class="panel-card p-3 mb-3"><div class="row g-2 align-items-end">
     <div class="col-md-3"><label class="form-label small">Día de la semana</label><select class="form-select form-select-sm" id="cobranzaDia"><option value="SEMANA">Semana actual</option><option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="0">Domingo</option></select></div>
    <div class="col-md-3"><label class="form-label small">Cliente</label><input type="search" class="form-control form-control-sm" id="cobranzaCliente" placeholder="Nombre del cliente"></div>
    <div class="col-md-3"><label class="form-label small">Estado</label><select class="form-select form-select-sm" id="cobranzaEstado"><option value="">Todos</option><option value="PENDIENTE">Pendientes</option><option value="PARCIAL">Parciales</option><option value="PAGADA">Pagadas</option></select></div>
    <div class="col-md-3"><label class="form-label small">Cobrador</label><select class="form-select form-select-sm" id="cobranzaCobrador"><option value="">Mi cartera</option></select></div>
    <div class="col-md-3"><label class="form-label small">Antigüedad</label><select class="form-select form-select-sm" id="cobranzaAntiguedad"><option value="">Todos</option><option value="HOY">Cobros de hoy</option><option value="ATRASADOS">Atrasados pendientes</option></select></div>
     <div class="col-md-3 d-flex gap-2"><button class="btn btn-outline-secondary btn-sm" id="btnHoyCobranza">Hoy</button></div>
  </div></div>
   <div class="row g-3 mb-3"><div class="col-md-4"><button type="button" class="stat-card w-100 text-start border-0" data-cobranza-card="HOY"><div class="stat-icon" style="background:rgba(37,99,235,.12);color:#2563eb"><i class="fas fa-calendar-day"></i></div><div class="stat-info"><div class="stat-number" id="cobranzaCreditosDia">0</div><div class="stat-label">Créditos del día</div></div></button></div><div class="col-md-4"><button type="button" class="stat-card w-100 text-start border-0" data-cobranza-card="ATRASADOS"><div class="stat-icon" style="background:rgba(245,158,11,.12);color:#f59e0b"><i class="fas fa-triangle-exclamation"></i></div><div class="stat-info"><div class="stat-number" id="cobranzaCreditosAtrasados">0</div><div class="stat-label">Créditos atrasados</div></div></button></div><div class="col-md-4"><button type="button" class="stat-card w-100 text-start border-0" data-cobranza-card="SEMANA"><div class="stat-icon" style="background:rgba(16,185,129,.12);color:#10b981"><i class="fas fa-calendar-week"></i></div><div class="stat-info"><div class="stat-number" id="cobranzaCarteraSemanal">0</div><div class="stat-label">Cartera semanal</div></div></button></div></div>
   <div class="panel-card p-3 mb-3" id="cobranzaProgresoPanel"><div class="d-flex justify-content-between align-items-center mb-2"><h6 class="mb-0"><i class="fas fa-bullseye me-2"></i>Progreso de meta del día</h6><small class="text-muted" id="cobranzaProgresoFecha"></small></div><div id="cobranzaProgresoGlobal"></div><div class="table-responsive mt-3"><table class="table table-sm table-custom mb-0"><thead><tr><th>Cobrador</th><th class="text-end">Meta</th><th class="text-end">Cobrado</th><th style="min-width:220px">Progreso</th><th class="text-end">Restante</th><th></th></tr></thead><tbody id="cobranzaProgresoBody"></tbody></table></div></div>
   <div class="panel-card p-3 mb-3"><div class="d-flex justify-content-between align-items-center mb-2"><h6 class="mb-0"><i class="fas fa-calendar-week me-2"></i>Calendario semanal</h6><small class="text-muted">Selecciona un crédito para ver el detalle</small></div><div id="cobranzaCalendario" class="cobranza-calendar"></div></div>
   <div class="panel-card overflow-hidden"><div class="table-responsive"><table class="table table-custom mb-0"><thead><tr><th>Fecha</th><th>Cliente</th><th>Contacto</th><th>Dirección</th><th>Crédito</th><th class="text-end">Programado</th><th class="text-end">Saldo</th><th>Estado</th><th></th></tr></thead><tbody id="tableCobranzaBody"><tr><td colspan="9"><div class="empty-state"><i class="fas fa-hand-holding-dollar"></i><p>Cargando...</p></div></td></tr></tbody></table></div><div id="cobranzaPagination" class="p-3"></div></div>
</div>
<div class="modal fade" id="cobranzaAbonoModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content border-0 shadow"><div class="modal-header border-0"><h5 class="modal-title fw-bold">Registrar cobranza</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="small mb-2" id="cobranzaAbonoInfo"></div><label class="form-label">Monto <span class="text-danger">*</span></label><input type="number" class="form-control mb-2" id="cobranzaAbonoMonto" min="0.01" step="0.01"><label class="form-label">Caja abierta <span class="text-danger">*</span></label><select class="form-select mb-2" id="cobranzaAbonoCaja"></select><label class="form-label">Forma de pago <span class="text-danger">*</span></label><select class="form-select" id="cobranzaAbonoTipoPago"></select></div><div class="modal-footer border-0"><button class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-success btn-sm" id="btnGuardarCobranzaAbono">Registrar abono</button></div></div></div></div>
